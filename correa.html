const d64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
document.getElementById('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const err = document.getElementById('err'), b = document.getElementById('b');
  err.textContent = ''; b.disabled = true; b.textContent = 'Abriendo…';
  try {
    const clave = new TextEncoder().encode(document.getElementById('clave').value);
    const base = await crypto.subtle.importKey('raw', clave, 'PBKDF2', false, ['deriveKey']);
    const llave = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: d64(PAQUETE.sal), iterations: 200000, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plano = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: d64(PAQUETE.nonce) }, llave, d64(PAQUETE.datos));
    const html = new TextDecoder().decode(plano);
    document.open(); document.write(html); document.close();
  } catch (e) {
    err.textContent = 'Clave incorrecta.'; b.disabled = false; b.textContent = 'Abrir';
  }
});
